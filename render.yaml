previews:
  generation: off

services:
  - type: web
    name: queen-city-maid-operations
    runtime: node
    region: virginia
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run check:production-env && npm run migrate
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: queen-city-maid-production
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: queen-city-maid-production
          property: connectionString

databases:
  - name: queen-city-maid-production
    region: virginia
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: queen_city_maid
    user: queen_city_maid_owner
    ipAllowList: []
